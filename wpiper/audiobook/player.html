<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wpiper Audiobook Player</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2128;--mut:#667085;--line:#e1e4ea;--acc:#2f6fed;--acc-fg:#fff;--hl:#e8f0ff;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--fg:#e6e9ee;--mut:#97a0ae;--line:#2c323c;--acc:#5b93ff;--acc-fg:#0b1220;--hl:#22314f;--bad:#ff6b6b}}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:16px;margin:0}
header .by{color:var(--mut);font-size:13px}
.nav{display:flex;flex-wrap:wrap;gap:2px;margin-left:auto}
.nav a{padding:5px 10px;border-radius:7px;color:var(--mut);text-decoration:none;font-size:13px}
.nav a:hover{background:var(--bg);color:var(--fg)}
.nav a[aria-current]{background:var(--bg);color:var(--fg);font-weight:600}
button,select{padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button.primary{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:260px 1fr;gap:0}
@media (max-width:760px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}.chapters{max-height:28vh}}
.chapters{overflow-y:auto;border-right:1px solid var(--line);background:var(--card);padding:8px}
.chapters h2{font-size:12px;color:var(--mut);margin:6px 8px;text-transform:uppercase;letter-spacing:.04em}
.ch{display:flex;gap:8px;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:7px;background:none;padding:7px 8px;font-size:14px}
.ch:hover{background:var(--bg)}
.ch.on{background:var(--hl);font-weight:600}
.ch small{color:var(--mut);white-space:nowrap;font-weight:400}
.text{overflow-y:auto;padding:16px;scroll-behavior:smooth}
.text .inner{max-width:760px;margin:0 auto}
.chead{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 6px}
.cue{display:inline;padding:2px 3px;border-radius:5px;cursor:pointer;font-size:18px;line-height:1.75}
.cue:hover{background:var(--bg)}
.cue.on{background:var(--hl);box-shadow:0 0 0 1px var(--acc) inset}
.bar{border-top:1px solid var(--line);background:var(--card);padding:10px 16px;display:grid;gap:8px}
.seek{display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut)}
.seek input{flex:1;accent-color:var(--acc)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.ctl .now{flex:1 1 100%;text-align:center;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl label{font-size:13px;color:var(--mut);display:flex;gap:5px;align-items:center}
.list{max-width:640px;margin:30px auto;padding:0 16px;width:100%}
.list a{display:block;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);text-decoration:none}
.list a small{color:var(--mut);display:block}
.err{color:var(--bad);padding:20px;text-align:center}
</style>
</head>
<body>
<header>
  <h1 id="title">Audiobook player</h1><span class="by" id="by"></span>
  <nav class="nav"><a href="/">Dashboard</a><a href="/audiobook">Audiobook maker</a><a href="/audiobook/player" aria-current="page">Player</a></nav>
</header>
<div id="library" class="list" hidden></div>
<div id="app" class="layout" hidden>
  <nav class="chapters" id="chapters"></nav>
  <div class="text" id="text"><div class="inner" id="inner"></div></div>
</div>
<div id="bar" class="bar" hidden>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="ctl">
    <div class="now" id="now"></div>
    <button id="prevCh" title="Previous chapter (P)">&#9198;</button>
    <button id="back15" title="Back 15 s (Left)">-15 s</button>
    <button id="play" class="primary" style="min-width:84px" title="Play / pause (Space)">Play</button>
    <button id="fwd30" title="Forward 30 s (Right)">+30 s</button>
    <button id="nextCh" title="Next chapter (N)">&#9197;</button>
    <label>Speed <select id="speed"></select></label>
    <label>Sleep <select id="sleep"><option value="0">off</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option><option value="ch">end of chapter</option></select></label>
    <label><input type="checkbox" id="follow" checked> Follow text</label>
    <label>Format <select id="fmt"></select></label>
  </div>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
// ?key= from the maker's link, else the key saved by the dashboard / maker
const savedKey = (() => { try { return localStorage.getItem('wpiper_admin_key') || localStorage.getItem('wpiperKey') || ''; } catch (e) { return ''; } })();
const KEY = params.get('key') || savedKey;
const kq = KEY ? '?key=' + encodeURIComponent(KEY) : '';
const hdr = KEY ? {'X-Admin-Key': KEY} : {};
const api = async p => { const r = await fetch('/audiobook/api' + p, {headers: hdr}); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status); return r.json(); };
const store = {
  get(k, d) { try { const v = localStorage.getItem('wpiper.player.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wpiper.player.' + k, JSON.stringify(v)); } catch (e) {} }
};
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const audio = $('audio');
let D = null, jobId = '', cueEls = [], curCue = -1, curCh = -1, dragging = false, sleepAt = 0, sleepChapter = false, lastSave = 0, userScrollUntil = 0;

async function library() {
  $('library').hidden = false;
  try {
    const jobs = (await api('/jobs')).filter(j => j.status === 'done');
    $('library').innerHTML = jobs.length ? '<h2>Finished audiobooks</h2>' + jobs.map(j => {
      const pos = store.get('pos.' + j.id, null);
      return `<a href="?job=${j.id}${KEY ? '&key=' + encodeURIComponent(KEY) : ''}">${esc(j.title)}<small>${fmt((j.summary || {}).duration_seconds)} · ${(j.summary || {}).chapters || 0} chapter(s)${pos ? ' · resume at ' + fmt(pos.t) : ''}</small></a>`;
    }).join('') : '<div class="err">No finished audiobooks yet. Build one in the maker first.</div>';
  } catch (e) { $('library').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function open(id) {
  jobId = id;
  try { D = await api(`/jobs/${id}/player`); } catch (e) { $('library').hidden = false; $('library').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  document.title = D.title + ' - wpiper player';
  $('title').textContent = D.title; $('by').textContent = D.author ? 'by ' + D.author : '';
  if (!D.audio.length) { $('library').hidden = false; $('library').innerHTML = '<div class="err">This job has no playable audio file.</div>'; return; }
  $('app').hidden = false; $('bar').hidden = false;

  // formats: mp3 first, remembered choice wins
  const want = store.get('format', '');
  $('fmt').innerHTML = D.audio.map(f => `<option value="${esc(f)}">${esc(f.split('.').pop())}</option>`).join('');
  // wav first: it seeks sample-exactly in every browser (mp3/opus seeking can be off by a lot in some)
  const startFile = D.audio.find(f => f.endsWith('.' + want)) || D.audio.find(f => f.endsWith('.wav')) || D.audio[0];
  $('fmt').value = startFile;
  $('speed').innerHTML = [0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5].map(v => `<option value="${v}">${v}x</option>`).join('');
  $('speed').value = String(store.get('speed', 1));

  // chapters (fall back to one "whole book" entry)
  D.chapters.forEach(c => { if (!c.title || c.title === 'input') c.title = D.title; });
  if (!D.chapters.length) D.chapters = [{title: D.title, start: 0, end: D.duration || 1e9}];
  $('chapters').innerHTML = '<h2>Chapters</h2>' + D.chapters.map((c, i) => `<button class="ch" data-i="${i}"><span>${esc(c.title)}</span><small>${fmt(c.start)}</small></button>`).join('');

  // transcript
  let h = '', ci = -1;
  D.cues.forEach((c, i) => {
    let k = D.chapters.findIndex(x => c.s >= x.start - 0.05 && c.s < x.end - 0.01);
    if (k !== ci && k >= 0) { ci = k; h += `<div class="chead" data-ch="${k}">${esc(D.chapters[k].title)}</div>`; }
    h += `<span class="cue" data-i="${i}">${esc(c.t)}</span> `;
  });
  $('inner').innerHTML = h || '<div class="err">No subtitles for this job.</div>';
  cueEls = [...document.querySelectorAll('.cue')];

  setSource(startFile, store.get('pos.' + id, {t: 0}).t, false);
  audio.playbackRate = parseFloat($('speed').value);
  $('follow').checked = store.get('follow', true);
}

function setSource(file, t, play) {
  const wasPlaying = play === undefined ? !audio.paused : play;
  audio.src = `/audiobook/api/jobs/${jobId}/stream/${file.split('/').map(encodeURIComponent).join('/')}${kq}`;
  audio.addEventListener('loadedmetadata', function f() {
    audio.removeEventListener('loadedmetadata', f);
    audio.currentTime = Math.min(t || 0, (audio.duration || t) - 0.5);
    audio.playbackRate = parseFloat($('speed').value);
    if (wasPlaying) audio.play().catch(() => {});
    tick();
  });
  audio.load();
}

function seekTo(t, play) {
  audio.currentTime = Math.max(0, Math.min(t, (audio.duration || t)));
  if (play) audio.play().catch(() => {});
  tick();
}
function chapterAt(t) { let k = 0; for (let i = 0; i < D.chapters.length; i++) if (t >= D.chapters[i].start - 0.05) k = i; return k; }
function cueAt(t) {   // last cue starting at or before t (binary search)
  const c = D.cues; let lo = 0, hi = c.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (c[m].s <= t + 0.02) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}

function tick() {
  if (!D) return;
  const t = audio.currentTime || 0, dur = audio.duration || D.duration || 0;
  if (!dragging) { $('seek').value = dur ? Math.round(1000 * t / dur) : 0; }
  $('cur').textContent = fmt(t); $('dur').textContent = fmt(dur);
  const ch = chapterAt(t);
  if (ch !== curCh) {
    curCh = ch;
    document.querySelectorAll('.ch').forEach((b, i) => b.classList.toggle('on', i === ch));
    const b = document.querySelector('.ch.on'); if (b) b.scrollIntoView({block: 'nearest'});
    if (sleepChapter && sleepChapter !== true && ch !== sleepChapter.from) { audio.pause(); sleepChapter = false; $('sleep').value = '0'; }
  }
  $('now').textContent = `${D.chapters[ch].title}  ·  ${fmt(t - D.chapters[ch].start)} / ${fmt(D.chapters[ch].end - D.chapters[ch].start)}`;
  const k = cueAt(t);
  if (k !== curCue) {
    if (cueEls[curCue]) cueEls[curCue].classList.remove('on');
    curCue = k;
    const el = cueEls[k];
    if (el) {
      el.classList.add('on');
      if ($('follow').checked && Date.now() > userScrollUntil) {
        const box = $('text'), r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
        if (r.top < b.top + 40 || r.bottom > b.bottom - 40) box.scrollTop += r.top - b.top - b.height / 3;
      }
    }
  }
  if (sleepAt && Date.now() >= sleepAt) { audio.pause(); sleepAt = 0; $('sleep').value = '0'; }
  const now = Date.now();
  if (now - lastSave > 3000 && t > 0) { lastSave = now; store.set('pos.' + jobId, {t, at: now}); }
}

audio.addEventListener('timeupdate', tick);
audio.addEventListener('play', () => { $('play').textContent = 'Pause'; setSession(); });
audio.addEventListener('pause', () => { $('play').textContent = 'Play'; store.set('pos.' + jobId, {t: audio.currentTime, at: Date.now()}); });
audio.addEventListener('ended', () => store.set('pos.' + jobId, {t: 0, at: Date.now()}));
audio.addEventListener('error', () => { $('now').textContent = 'Could not load audio (try another format).'; });
window.addEventListener('beforeunload', () => { if (D) store.set('pos.' + jobId, {t: audio.currentTime, at: Date.now()}); });

$('play').onclick = () => audio.paused ? audio.play().catch(() => {}) : audio.pause();
$('back15').onclick = () => seekTo(audio.currentTime - 15);
$('fwd30').onclick = () => seekTo(audio.currentTime + 30);
$('prevCh').onclick = () => { const c = D.chapters[chapterAt(audio.currentTime)]; seekTo(audio.currentTime - c.start > 4 ? c.start : D.chapters[Math.max(0, chapterAt(audio.currentTime) - 1)].start); };
$('nextCh').onclick = () => { const i = chapterAt(audio.currentTime); if (i + 1 < D.chapters.length) seekTo(D.chapters[i + 1].start); };
$('seek').addEventListener('input', () => { dragging = true; $('cur').textContent = fmt($('seek').value / 1000 * (audio.duration || 0)); });
$('seek').addEventListener('change', () => { dragging = false; seekTo($('seek').value / 1000 * (audio.duration || 0)); });
$('speed').onchange = () => { audio.playbackRate = parseFloat($('speed').value); store.set('speed', audio.playbackRate); };
$('follow').onchange = () => store.set('follow', $('follow').checked);
$('fmt').onchange = () => { const f = $('fmt').value; store.set('format', f.split('.').pop()); setSource(f, audio.currentTime); };
$('sleep').onchange = () => {
  const v = $('sleep').value; sleepAt = 0; sleepChapter = false;
  if (v === 'ch') sleepChapter = {from: chapterAt(audio.currentTime)}; else if (+v) sleepAt = Date.now() + (+v) * 60000;
};
$('chapters').onclick = e => { const b = e.target.closest('.ch'); if (b) seekTo(D.chapters[+b.dataset.i].start, true); };
$('inner').onclick = e => { const c = e.target.closest('.cue'); if (c) seekTo(D.cues[+c.dataset.i].s, true); };
['wheel', 'touchmove'].forEach(ev => $('text').addEventListener(ev, () => { userScrollUntil = Date.now() + 6000; }, {passive: true}));
document.addEventListener('keydown', e => {
  if (!D || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type !== 'checkbox' && document.activeElement.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); $('back15').click(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); $('fwd30').click(); }
  else if (e.key === 'n') $('nextCh').click();
  else if (e.key === 'p') $('prevCh').click();
});
function setSession() {
  if (!('mediaSession' in navigator) || !D) return;
  navigator.mediaSession.metadata = new MediaMetadata({title: D.chapters[Math.max(curCh, 0)].title, artist: D.author || '', album: D.title});
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => seekTo(audio.currentTime - 15));
  navigator.mediaSession.setActionHandler('seekforward', () => seekTo(audio.currentTime + 30));
  navigator.mediaSession.setActionHandler('previoustrack', () => $('prevCh').click());
  navigator.mediaSession.setActionHandler('nexttrack', () => $('nextCh').click());
}

const id = params.get('job');
if (id) open(id); else library();
</script>
</body>
</html>
