<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training viewer</title>
<style>
:root{--bg:#f6f5f1;--panel:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#e1e0d9;--axis:#c3c2b7;--accent:#2a78d6;--c1:#2a78d6;--c2:#eb6834;--c3:#6250d6;--good:#0ca30c;--warn:#c98500;}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--panel:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--line:#2c2c2a;--axis:#383835;--accent:#3987e5;--c1:#3987e5;--c2:#d95926;--c3:#9085e9;--good:#34c234;--warn:#e0a020;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:18px;font-weight:600;margin:0;flex:1 1 auto}
h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
select,button,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--axis)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live .dot{background:var(--good);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tile .l{font-size:12px;color:var(--muted)}.tile .v{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}.tile .s{font-size:12px;color:var(--ink2)}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 6px;font-size:12px;color:var(--ink2)}
.legend label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.sw{width:10px;height:10px;border-radius:2px}
#chartwrap{position:relative;height:300px}
canvas{width:100%;height:100%;display:block}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;display:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1 1 260px;min-width:0}
.pl{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
audio{height:32px;width:230px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.chip{padding:2px 10px;border-radius:99px;font-size:12px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:4px 8px;border-top:1px solid var(--line)}th{color:var(--muted);font-weight:500;border-top:0}
code{font:12px ui-monospace,Consolas,monospace;background:var(--bg);padding:2px 6px;border-radius:6px}
.muted{color:var(--muted)}
@media (max-width:600px){audio{width:100%}}
</style>
</head>
<body>
<main>
<header>
  <h1>Training viewer</h1>
  <span id="status" class="pill"><span class="dot"></span><span id="statustxt">loading</span></span>
  <select id="runsel" aria-label="Run"></select>
  <label class="pill" style="cursor:pointer"><input type="checkbox" id="auto" checked style="padding:0"> auto-refresh</label>
</header>

<div class="tiles" id="tiles"></div>

<section>
  <h2>Loss</h2>
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px">
    <select id="metric" aria-label="Metric"></select>
    <div class="legend" id="legend" style="margin:0"></div>
  </div>
  <div id="chartwrap"><canvas id="chart"></canvas><div id="tip"></div></div>
</section>

<section>
  <h2>Samples from the run (held-out test clips)</h2>
  <div class="chips" id="epochchips"></div>
  <div style="margin-bottom:6px;font-size:12px;color:var(--ink2)">Compare with <select id="cmp"></select></div>
  <div id="samples"></div>
</section>

<section>
  <h2>Renders (voices folder)</h2>
  <div class="chips"><select id="rendersel" aria-label="Render set"></select></div>
  <div id="renders"></div>
</section>

<section>
  <h2>Checkpoints</h2>
  <div id="ckpts"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let run=null,runName=store.get('run',''),epochSel=null,cmpSel='',ref={},renders=[],sig={samples:'',renders:''};
const METRICS={g:'Generator total',mel:'Mel (x45)',kl:'KL',dur:'Duration',fm:'Feature matching',adv:'Adversarial',d:'Discriminator'};
const SERIES=[
  {id:'train',label:'Train (per epoch)',color:'--c1',w:1,alpha:.35},
  {id:'trainavg',label:'Train, 5-epoch average',color:'--c1',w:2},
  {id:'val',label:'Validation',color:'--c2',pts:true},
  {id:'valavg',label:'Validation, 3-point average',color:'--c3',w:2},
];
const on=JSON.parse(store.get('series','{}'));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(v,d=1)=>v==null?'-':v.toFixed(d);
const ago=t=>{if(!t)return'-';const s=Math.max(0,Date.now()/1000-t);return s<90?Math.round(s)+'s ago':s<5400?Math.round(s/60)+' min ago':(s/3600).toFixed(1)+' h ago'};
const dur=s=>{if(s==null||!isFinite(s))return'-';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':m?m+'m '+(s%60)+'s':s+'s'};
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function movavg(xs,ys,n){return ys.map((_,i)=>{const lo=Math.max(0,i-n+1);return mean(ys.slice(lo,i+1))})}
async function j(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' '+r.status);return r.json()}

async function loadRuns(){
  const runs=await j('/api/runs');
  const sel=$('runsel');sel.innerHTML='';
  runs.forEach(r=>{const o=document.createElement('option');o.value=r.name;o.textContent=r.name+(r.active?'  (training)':'  (epoch '+r.epoch+')');sel.appendChild(o)});
  if(!runs.length){$('statustxt').textContent='no runs found in runs/';return false}
  if(!runs.find(r=>r.name===runName)){runName=(runs.find(r=>r.active)||runs[runs.length-1]).name}
  sel.value=runName;return true;
}
async function refresh(){
  if(!runName)return;
  run=await j('/api/run/'+encodeURIComponent(runName));
  render();
}
function target(){return run.max_epochs||parseInt(store.get('target_'+run.name,''))||null}
function render(){
  const t=run.train,n=t.epoch.length;
  $('status').className='pill'+(run.active?' live':'');
  $('statustxt').textContent=run.active?'training':'idle';
  const tgt=target(),sec=run.sec_per_epoch;
  const eta=run.active&&tgt&&sec?(tgt-run.epoch)*sec:null;
  const recentG=n?mean(t.g.slice(-5)):null,v=run.val.slice(-3),recentV=v.length?mean(v.map(x=>x[1])):null;
  const pct=tgt?Math.min(100,100*run.epoch/tgt):0;
  $('tiles').innerHTML=
   tile('Epoch',run.epoch+(tgt?' / '+tgt:''),'<div class="bar"><i style="width:'+pct+'%"></i></div>')+
   tile('Speed',sec?fmt(sec)+' s':'-','per epoch (wall)')+
   tile('Time left',eta!=null?dur(eta):(run.active?'<input id="tgt" placeholder="target ep." size="6" style="width:100%">':'-'),eta!=null?'at epoch '+tgt:'')+
   tile('Train loss',fmt(recentG),'last 5 epochs')+
   tile('Val loss',fmt(recentV),'last 3 checks')+
   tile('Updated',ago(run.last_update),run.checkpoints.length+' checkpoint(s)');
  const tg=$('tgt');if(tg)tg.onchange=()=>{store.set('target_'+run.name,tg.value);render()};
  renderLegend();drawChart();renderSamples();renderCkpts();
}
const tile=(l,v,s)=>'<div class="tile"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+(s||'')+'</div></div>';

function renderLegend(){
  $('legend').innerHTML=SERIES.map(s=>'<label><input type="checkbox" data-s="'+s.id+'" '+(on[s.id]===false?'':'checked')+' style="padding:0"><span class="sw" style="background:var('+s.color+');opacity:'+(s.alpha||1)+'"></span>'+s.label+'</label>').join('');
  $('legend').querySelectorAll('input').forEach(i=>i.onchange=()=>{on[i.dataset.s]=i.checked;store.set('series',JSON.stringify(on));drawChart()});
}
let plot=null;
function drawChart(){
  const cv=$('chart'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,W,H);
  const m=$('metric').value||'g',t=run.train;
  const ep=t.epoch,ys=t[m]||[];
  const lines={};
  lines.train=ep.map((e,i)=>[e,ys[i]]);
  const ta=movavg(ep,ys,5);lines.trainavg=ep.map((e,i)=>[e,ta[i]]);
  const hasVal=m==='g'&&run.val.length;
  if(hasVal){lines.val=run.val.map(p=>[p[0],p[1]]);const va=run.val.map((_,i)=>mean(run.val.slice(Math.max(0,i-2),i+1).map(x=>x[1])));lines.valavg=run.val.map((p,i)=>[p[0],va[i]])}
  const vis=SERIES.filter(s=>on[s.id]!==false&&lines[s.id]);
  const all=vis.flatMap(s=>lines[s.id].filter(p=>p[0]>=Math.min(4,ep[ep.length-1]||4)).map(p=>p[1])).filter(v=>v!=null).sort((a,b)=>a-b);
  const pad={l:48,r:12,t:8,b:26};
  c.font='11px system-ui';c.fillStyle=css('--muted');
  if(!all.length){c.fillText('no data yet',pad.l,H/2);plot=null;return}
  let lo=all[0],hi=all[Math.floor(all.length*.995)];const span=(hi-lo)||1;lo-=span*.05;hi+=span*.05;
  const xmax=Math.max(10,ep[ep.length-1]||0);
  const X=e=>pad.l+(e/xmax)*(W-pad.l-pad.r),Y=v=>pad.t+(1-(v-lo)/(hi-lo))*(H-pad.t-pad.b);
  c.strokeStyle=css('--line');c.lineWidth=1;c.textAlign='right';
  for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5,y=Math.round(Y(v))+.5;c.beginPath();c.moveTo(pad.l,y);c.lineTo(W-pad.r,y);c.stroke();c.fillText(v.toFixed(v>=100?0:1),pad.l-6,y+4)}
  c.textAlign='center';const step=niceStep(xmax/6);
  for(let e=0;e<=xmax;e+=step)c.fillText(e,X(e),H-8);
  c.strokeStyle=css('--axis');c.beginPath();c.moveTo(pad.l,H-pad.b+.5);c.lineTo(W-pad.r,H-pad.b+.5);c.stroke();
  c.save();c.beginPath();c.rect(pad.l,pad.t,W-pad.l-pad.r,H-pad.t-pad.b);c.clip();
  vis.forEach(s=>{
    const col=css(s.color);c.globalAlpha=s.alpha||1;c.strokeStyle=col;c.fillStyle=col;c.lineWidth=s.w||1;c.lineJoin='round';
    const pts=lines[s.id];
    if(s.pts){c.globalAlpha=.35;c.lineWidth=1;c.setLineDash([4,3]);path(c,pts,X,Y);c.setLineDash([]);c.globalAlpha=1;pts.forEach(p=>{c.beginPath();c.arc(X(p[0]),Y(p[1]),2.6,0,7);c.fill()})}
    else path(c,pts,X,Y);
  });
  c.restore();c.globalAlpha=1;
  plot={X,Y,lines,vis,pad,W,H,xmax};
}
function path(c,pts,X,Y){c.beginPath();pts.forEach((p,i)=>{i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]))});c.stroke()}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*p}
$('chart').addEventListener('mousemove',ev=>{
  if(!plot)return;const r=$('chart').getBoundingClientRect(),x=ev.clientX-r.left;
  const e=Math.round((x-plot.pad.l)/(plot.W-plot.pad.l-plot.pad.r)*plot.xmax);
  if(e<0||e>plot.xmax){$('tip').style.display='none';return}
  const rows=plot.vis.map(s=>{const pts=plot.lines[s.id];let best=null;pts.forEach(p=>{if(best==null||Math.abs(p[0]-e)<Math.abs(best[0]-e))best=p});return best&&Math.abs(best[0]-e)<=(s.pts?3:1)?'<span style="color:var('+s.color+')">&#9632;</span> '+s.label+': '+best[1].toFixed(2)+(s.pts?' (ep '+best[0]+')':''):null}).filter(Boolean);
  const tip=$('tip');tip.innerHTML='<b>epoch '+e+'</b><br>'+rows.join('<br>');tip.style.display='block';
  tip.style.left=Math.min(x+12,r.width-tip.offsetWidth-4)+'px';tip.style.top='10px';
});
$('chart').addEventListener('mouseleave',()=>$('tip').style.display='none');
$('metric').innerHTML=Object.entries(METRICS).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');
$('metric').onchange=drawChart;addEventListener('resize',()=>run&&drawChart());

function anyPlaying(){return [...document.querySelectorAll('audio')].some(a=>!a.paused)}
function renderSamples(){
  const eps=Object.keys(run.samples).map(Number).sort((a,b)=>a-b);
  const s=run.name+'|'+eps.join(',');
  if(!eps.length){$('epochchips').innerHTML='';$('samples').innerHTML='<span class="muted">No samples yet. They appear every 50 epochs.</span>';sig.samples=s;return}
  if(s===sig.samples&&epochSel!=null)return;
  const newest=eps[eps.length-1];
  if(epochSel==null||!eps.includes(epochSel)||(sig.samples.split('|')[0]===run.name&&epochSel===Number(sig.samples.split('|')[1].split(',').pop())&&!anyPlaying()))epochSel=newest;
  sig.samples=s;
  $('epochchips').innerHTML=eps.map(e=>'<span class="chip'+(e===epochSel?' on':'')+'" data-e="'+e+'">epoch '+e+'</span>').join('');
  $('epochchips').querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{epochSel=+ch.dataset.e;sig.samples='';renderSamples()});
  $('cmp').innerHTML='<option value="">(none)</option>'+eps.filter(e=>e!==epochSel).map(e=>'<option value="'+e+'"'+(String(e)===cmpSel?' selected':'')+'>epoch '+e+'</option>').join('');
  $('cmp').onchange=()=>{cmpSel=$('cmp').value;sig.samples='';renderSamples()};
  const clips=run.samples[String(epochSel)];
  const rn=encodeURIComponent(run.name);
  $('samples').innerHTML=clips.map(id=>{
    const a=(lbl,u)=>'<div class="pl">'+lbl+'<audio controls preload="none" src="'+u+'"></audio></div>';
    return '<div class="row"><div class="t">'+esc(ref[id]||id)+'<div class="muted" style="font-size:12px">'+id+'</div></div>'+
      (ref[id]?a('original','/reference/'+id+'.wav'):'')+a('epoch '+epochSel,'/samples/'+rn+'/'+epochSel+'/'+id+'.wav')+
      (cmpSel&&run.samples[cmpSel]?a('epoch '+cmpSel,'/samples/'+rn+'/'+cmpSel+'/'+id+'.wav'):'')+'</div>';
  }).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadRenders(){
  renders=await j('/api/renders');const s=JSON.stringify(renders.map(r=>[r.name,r.items.length,r.mtime]));
  if(s===sig.renders)return;sig.renders=s;
  const sel=$('rendersel'),cur=sel.value;
  sel.innerHTML=renders.map(r=>'<option>'+esc(r.name)+'</option>').join('');
  if(renders.find(r=>r.name===cur))sel.value=cur;
  showRender();
}
function showRender(){
  const r=renders.find(x=>x.name===$('rendersel').value);
  if(!r){$('renders').innerHTML='<span class="muted">No render folders in voices/ yet.</span>';return}
  $('renders').innerHTML=r.items.map(it=>'<div class="row"><div class="t">'+esc(it.text)+'</div><audio controls preload="none" src="/renders/'+encodeURIComponent(r.name)+'/'+encodeURIComponent(it.file)+'"></audio></div>').join('');
}
$('rendersel').onchange=showRender;

function renderCkpts(){
  const c=run.checkpoints;
  $('ckpts').innerHTML=c.length?'<table><tr><th>File</th><th>Size</th><th>Saved</th></tr>'+c.map(k=>'<tr><td>'+k.name+'</td><td>'+k.mb+' MB</td><td>'+ago(k.mtime)+'</td></tr>').join('')+'</table>'+
   '<p class="muted" style="margin:10px 0 4px;font-size:12px">Export the newest checkpoint:</p><code>python -m wpiper.export_onnx --checkpoint runs\\'+run.name+'\\'+c[c.length-1].name+' --config data\\'+run.name+'\\config.json --output voices\\'+run.name+'.onnx</code>':'<span class="muted">No checkpoints yet.</span>';
}

$('runsel').onchange=()=>{runName=$('runsel').value;store.set('run',runName);epochSel=null;cmpSel='';sig.samples='';refresh()};
async function tick(){try{await loadRuns();await refresh();await loadRenders()}catch(e){$('statustxt').textContent='error: '+e.message}}
(async()=>{try{ref=await j('/api/reference')}catch(e){}await tick();setInterval(()=>{if($('auto').checked)tick()},10000)})();
</script>
</body>
</html>
